  <!-- Score + overview -->

      <div style="flex: 1; min-height: 0; display: flex; border-bottom: 1px solid #E4E6EA">
        <div style="width: 196px; flex-shrink: 0; box-sizing: border-box; padding: 4px 12px 4px 10px; border-left: 4px solid #C2541F; border-right: 1px solid #D9DCE1; display: flex; flex-direction: column; justify-content: center; gap: 2px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 13px; font-weight: 700">E.Piano</span><span style="font-size: 10px; color: #5A606B">コード</span></div>
