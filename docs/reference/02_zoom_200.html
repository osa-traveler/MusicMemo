<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A案-2 ズームイン 200%</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB0}
button{font-family:inherit}
input[type=range]{accent-color:#2F5BEA}
</style>
</head>
<body>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #EEF0F2; color: #1B1D21; font-family: 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden">

  <!-- Top bar -->
  <div style="height: 64px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #D9DCE1; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box">
    <button aria-label="スケッチ一覧へ戻る" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #1B1D21">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 17px; font-weight: 700">スケッチ 03</div>
      <div style="font-size: 12px; color: #5A606B">C major · 4/4 · ♩=96 · 16小節 · 6トラック</div>
    </div>
    <div style="flex: 1"></div>
    <div style="display: flex; gap: 4px; background: #EEF0F2; border-radius: 12px; padding: 4px">
      <button aria-label="再生" style="width: 44px; height: 40px; border: none; border-radius: 9px; background: #2F5BEA; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 4l11 6-11 6z"/></svg>
      </button>
      <button aria-label="ループ" style="width: 44px; height: 40px; border: none; border-radius: 9px; background: transparent; color: #1B1D21; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10V9a4 4 0 0 1 4-4h8l-2.5-2.5M16 10v1a4 4 0 0 1-4 4H4l2.5 2.5"/></svg>
      </button>
      <button aria-label="メトロノーム" style="width: 44px; height: 40px; border: none; border-radius: 9px; background: transparent; color: #1B1D21; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h10L12 3H8z M10 13l5-6"/></svg>
      </button>
    </div>
    <button aria-label="元に戻す" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #1B1D21">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h9a4.5 4.5 0 0 1 0 9H9"/></svg>
    </button>
    <button aria-label="やり直す" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #1B1D21">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l4 4-4 4M17 8H8a4.5 4.5 0 0 0 0 9h3"/></svg>
    </button>
    <button style="height: 44px; border: 1px solid #C9CDD3; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; font-weight: 500; color: #1B1D21">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 12v5h12v-5"/></svg>
      Logicへ書き出し
    </button>
  </div>

  <!-- Score + overview -->
  <div style="flex: 1; min-height: 0; padding: 14px 18px 12px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; background: #1B1D21; color: #FFFFFF; padding: 4px 10px; border-radius: 999px">Aメロ</span>
      <span style="font-size: 12px; color: #5A606B; padding: 4px 10px; border-radius: 999px; border: 1px solid #C9CDD3">サビ</span>
      <span style="font-size: 12px; color: #5A606B; padding: 4px 10px; border-radius: 999px; border: 1px dashed #C9CDD3">＋ セクション</span>
      <div style="flex: 1"></div>
      <span style="font-size: 12px; color: #5A606B">表示 6〜7小節 · 2/6トラック · 入力位置 7小節 1拍目</span>
    </div>

    <!-- Multi-track score view (200%) -->
    <div style="flex: 1; min-height: 0; background: #FFFFFF; border-radius: 14px; box-shadow: 0 1px 2px rgba(20,22,26,0.06); position: relative; overflow: hidden; display: flex; flex-direction: column; padding-right: 16px">

      <!-- Ruler (16th grid, 200%) -->
      <div style="height: 28px; flex-shrink: 0; display: flex; border-bottom: 1px solid #D9DCE1; background: #F6F7F9">
        <div style="width: 196px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid #D9DCE1; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; color: #5A606B">
          <span>小節 · 拍</span>
          <span style="font-weight: 700; color: #D92D20">7 . 1 . 1</span>
        </div>
        <svg width="946" height="28" viewBox="0 0 946 28" style="display: block; flex-shrink: 0" role="img" aria-label="ルーラ 6〜7小節、16分刻み（200%）">
          <g font-size="11" font-weight="700" fill="#1B1D21"><text x="24" y="12">6</text><text x="468" y="12">7</text></g>
          <g font-size="9" fill="#8A909A"><text x="179" y="12">2</text><text x="275" y="12">3</text><text x="371" y="12">4</text><text x="623" y="12">2</text><text x="719" y="12">3</text><text x="815" y="12">4</text></g>
          <g stroke="#5A606B" stroke-width="1">
            <line x1="20" y1="2" x2="20" y2="28"/><line x1="464" y1="2" x2="464" y2="28"/><line x1="908" y1="2" x2="908" y2="28"/>
            <line x1="76" y1="16" x2="76" y2="28"/><line x1="172" y1="16" x2="172" y2="28"/><line x1="268" y1="16" x2="268" y2="28"/><line x1="364" y1="16" x2="364" y2="28"/>
            <line x1="520" y1="16" x2="520" y2="28"/><line x1="616" y1="16" x2="616" y2="28"/><line x1="712" y1="16" x2="712" y2="28"/><line x1="808" y1="16" x2="808" y2="28"/>
          </g>
          <g stroke="#A9AEB6" stroke-width="1">
            <line x1="124" y1="21" x2="124" y2="28"/><line x1="220" y1="21" x2="220" y2="28"/><line x1="316" y1="21" x2="316" y2="28"/><line x1="412" y1="21" x2="412" y2="28"/>
            <line x1="568" y1="21" x2="568" y2="28"/><line x1="664" y1="21" x2="664" y2="28"/><line x1="760" y1="21" x2="760" y2="28"/><line x1="856" y1="21" x2="856" y2="28"/>
          </g>
          <g stroke="#C9CDD3" stroke-width="1">
            <line x1="100" y1="24" x2="100" y2="28"/><line x1="148" y1="24" x2="148" y2="28"/><line x1="196" y1="24" x2="196" y2="28"/><line x1="244" y1="24" x2="244" y2="28"/><line x1="292" y1="24" x2="292" y2="28"/><line x1="340" y1="24" x2="340" y2="28"/><line x1="388" y1="24" x2="388" y2="28"/><line x1="436" y1="24" x2="436" y2="28"/>
            <line x1="544" y1="24" x2="544" y2="28"/><line x1="592" y1="24" x2="592" y2="28"/><line x1="640" y1="24" x2="640" y2="28"/><line x1="688" y1="24" x2="688" y2="28"/><line x1="736" y1="24" x2="736" y2="28"/><line x1="784" y1="24" x2="784" y2="28"/><line x1="832" y1="24" x2="832" y2="28"/><line x1="880" y1="24" x2="880" y2="28"/>
          </g>
          <polygon points="513,6 527,6 520,15" fill="#D92D20"/>
        </svg>
      </div>

      <!-- Track 1: Melody (selected) -->
      <div style="flex: 1; min-height: 0; display: flex; border-bottom: 1px solid #E4E6EA">
        <div style="width: 196px; flex-shrink: 0; box-sizing: border-box; padding: 10px 12px 10px 10px; background: #EAF0FE; border-left: 4px solid #2F5BEA; border-right: 1px solid #D9DCE1; display: flex; flex-direction: column; justify-content: center; gap: 8px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 15px; font-weight: 700">Piano</span><span style="font-size: 11px; color: #5A606B">メロディ</span></div>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5A606B"><span style="width: 24px">Vol</span><input type="range" min="0" max="100" value="80" style="flex: 1; min-width: 0; margin: 0"></label>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5A606B"><span style="width: 24px">Pan</span><input type="range" min="-64" max="63" value="0" style="flex: 1; min-width: 0; margin: 0"><span style="width: 22px; text-align: right">C</span></label>
          <div style="display: flex; gap: 6px">
            <button aria-label="ミュート" style="width: 44px; height: 32px; border-radius: 8px; border: 1px solid #C9CDD3; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #1B1D21">M</button>
            <button aria-label="ソロ" style="width: 44px; height: 32px; border-radius: 8px; border: 1px solid #C9CDD3; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #1B1D21">S</button>
            <button style="flex: 1; height: 32px; border-radius: 8px; border: 1px solid #C9CDD3; background: #FFFFFF; font-size: 12px; color: #1B1D21">音色…</button>
          </div>
        </div>
        <svg viewBox="268 0 473 90" preserveAspectRatio="xMinYMid meet" style="flex: 1; min-width: 0; height: 100%; display: block" role="img" aria-label="メロディ 6〜7小節（200%）。7小節目に入力中">
          <rect x="502" y="14" width="218" height="74" rx="6" fill="#2F5BEA" fill-opacity="0.08"/>
          <g stroke="#E4E6EA" stroke-width="0.5">
            <line x1="330" y1="30" x2="330" y2="82"/><line x1="378" y1="30" x2="378" y2="82"/><line x1="426" y1="30" x2="426" y2="82"/><line x1="474" y1="30" x2="474" y2="82"/>
            <line x1="552" y1="30" x2="552" y2="82"/><line x1="600" y1="30" x2="600" y2="82"/><line x1="648" y1="30" x2="648" y2="82"/><line x1="696" y1="30" x2="696" y2="82"/>
          </g>
          <g stroke="#1B1D21" stroke-width="0.7">
            <line x1="8" y1="40" x2="944" y2="40"/><line x1="8" y1="48" x2="944" y2="48"/><line x1="8" y1="56" x2="944" y2="56"/><line x1="8" y1="64" x2="944" y2="64"/><line x1="8" y1="72" x2="944" y2="72"/>
            <line x1="278" y1="40" x2="278" y2="72"/><line x1="500" y1="40" x2="500" y2="72"/><line x1="722" y1="40" x2="722" y2="72"/>
          </g>
          <g fill="#1B1D21" stroke="#1B1D21" stroke-width="1">
            <ellipse cx="306" cy="48" rx="5.2" ry="3.7" transform="rotate(-20 306 48)"/><line x1="301" y1="48" x2="301" y2="74"/>
            <ellipse cx="354" cy="52" rx="5.2" ry="3.7" transform="rotate(-20 354 52)"/><line x1="349" y1="52" x2="349" y2="78"/>
            <ellipse cx="402" cy="60" rx="5.2" ry="3.7" transform="rotate(-20 402 60)" fill="#FFFFFF" stroke-width="1.3"/><line x1="407" y1="60" x2="407" y2="34"/>
          </g>
          <g fill="#2F5BEA" fill-opacity="0.45" stroke="#2F5BEA" stroke-opacity="0.45" stroke-width="1">
            <ellipse cx="528" cy="68" rx="5.2" ry="3.7" transform="rotate(-20 528 68)"/><line x1="533" y1="68" x2="533" y2="42"/>
          </g>
        </svg>
      </div>

      <!-- Track 2: Chords -->
      <div style="flex: 1; min-height: 0; display: flex">
        <div style="width: 196px; flex-shrink: 0; box-sizing: border-box; padding: 10px 12px 10px 10px; border-left: 4px solid #C2541F; border-right: 1px solid #D9DCE1; display: flex; flex-direction: column; justify-content: center; gap: 8px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 15px; font-weight: 700">E.Piano</span><span style="font-size: 11px; color: #5A606B">コード</span></div>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5A606B"><span style="width: 24px">Vol</span><input type="range" min="0" max="100" value="64" style="flex: 1; min-width: 0; margin: 0"></label>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5A606B"><span style="width: 24px">Pan</span><input type="range" min="-64" max="63" value="-16" style="flex: 1; min-width: 0; margin: 0"><span style="width: 22px; text-align: right">L16</span></label>
          <div style="display: flex; gap: 6px">
            <button aria-label="ミュート" style="width: 44px; height: 32px; border-radius: 8px; border: 1px solid #C9CDD3; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #1B1D21">M</button>
            <button aria-label="ソロ" style="width: 44px; height: 32px; border-radius: 8px; border: 1px solid #C9CDD3; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #1B1D21">S</button>
            <button style="flex: 1; height: 32px; border-radius: 8px; border: 1px solid #C9CDD3; background: #FFFFFF; font-size: 12px; color: #1B1D21">音色…</button>
          </div>
        </div>
        <svg viewBox="268 0 473 90" preserveAspectRatio="xMinYMid meet" style="flex: 1; min-width: 0; height: 100%; display: block" role="img" aria-label="コード 6〜7小節 F, Dm7（200%）">
          <g stroke="#1B1D21" stroke-width="0.7">
            <line x1="8" y1="40" x2="944" y2="40"/><line x1="8" y1="48" x2="944" y2="48"/><line x1="8" y1="56" x2="944" y2="56"/><line x1="8" y1="64" x2="944" y2="64"/><line x1="8" y1="72" x2="944" y2="72"/>
            <line x1="278" y1="40" x2="278" y2="72"/><line x1="500" y1="40" x2="500" y2="72"/><line x1="722" y1="40" x2="722" y2="72"/>
          </g>
          <g font-size="13" font-weight="700" fill="#C2541F"><text x="296" y="24">F</text><text x="518" y="24">Dm7</text></g>
          <g fill="none" stroke="#1B1D21" stroke-width="1.2">
            <ellipse cx="312" cy="68" rx="6" ry="4" transform="rotate(-15 312 68)"/><ellipse cx="312" cy="60" rx="6" ry="4" transform="rotate(-15 312 60)"/><ellipse cx="312" cy="52" rx="6" ry="4" transform="rotate(-15 312 52)"/>
            <ellipse cx="534" cy="76" rx="6" ry="4" transform="rotate(-15 534 76)"/><ellipse cx="534" cy="68" rx="6" ry="4" transform="rotate(-15 534 68)"/><ellipse cx="534" cy="60" rx="6" ry="4" transform="rotate(-15 534 60)"/><ellipse cx="534" cy="52" rx="6" ry="4" transform="rotate(-15 534 52)"/>
          </g>
        </svg>
      </div>

      <!-- Edit position line -->
      <div aria-hidden="true" style="position: absolute; top: 14px; bottom: 0; left: 715px; width: 2px; background: #D92D20; pointer-events: none"></div>

      <!-- Pinch gesture hint -->
      <div aria-hidden="true" style="position: absolute; left: 640px; top: 150px; width: 300px; height: 150px; pointer-events: none">
        <svg width="300" height="150" viewBox="0 0 300 150">
          <line x1="70" y1="110" x2="230" y2="40" stroke="#1B1D21" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 5"/>
          <path d="M40 124 L 70 110 M40 124 L 52 104 M40 124 L 62 128" fill="none" stroke="#1B1D21" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M260 26 L 230 40 M260 26 L 248 46 M260 26 L 238 22" fill="none" stroke="#1B1D21" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="90" cy="101" r="22" fill="#1B1D21" fill-opacity="0.14" stroke="#1B1D21" stroke-opacity="0.35" stroke-width="2"/>
          <circle cx="210" cy="49" r="22" fill="#1B1D21" fill-opacity="0.14" stroke="#1B1D21" stroke-opacity="0.35" stroke-width="2"/>
        </svg>
      </div>

      <!-- Zoom HUD -->
      <div style="position: absolute; top: 42px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: rgba(27,29,33,0.88); color: #FFFFFF; border-radius: 999px; padding: 4px; box-shadow: 0 4px 14px rgba(20,22,26,0.22)">
        <button aria-label="縮小" style="width: 40px; height: 36px; border: none; border-radius: 999px; background: transparent; color: #FFFFFF; font-size: 18px">−</button>
        <span style="font-size: 15px; font-weight: 700; width: 56px; text-align: center">200%</span>
        <button aria-label="拡大" style="width: 40px; height: 36px; border: none; border-radius: 999px; background: transparent; color: #FFFFFF; font-size: 18px">＋</button>
        <span style="width: 1px; height: 20px; background: rgba(255,255,255,0.3)"></span>
        <button style="height: 36px; border: none; border-radius: 999px; background: transparent; color: #FFFFFF; font-size: 12px; padding: 0 12px">100%に戻す</button>
      </div>

      <!-- Vertical scrollbar -->
      <div aria-label="縦スクロール（2/6トラック表示中）" style="position: absolute; top: 6px; right: 4px; bottom: 6px; width: 8px; border-radius: 4px; background: #EEF0F2">
        <div style="position: absolute; left: 0; right: 0; top: 0; height: 33%; border-radius: 4px; background: #8A909A"></div>
      </div>
    </div>

    <!-- Overview / horizontal scrollbar -->
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding-left: 196px; padding-right: 16px">
      <div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; font-size: 11px; font-weight: 700; color: #5A606B">
        <span style="grid-column: span 8; border-left: 2px solid #1B1D21; padding-left: 6px">Aメロ</span>
        <span style="grid-column: span 8; border-left: 2px solid #C9CDD3; padding-left: 6px">サビ</span>
      </div>
      <div style="position: relative">
        <div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px">
          <div style="height: 46px; background: #FFFFFF; border-radius: 8px; border: 1px solid #D9DCE1; padding: 5px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #C2541F">C</span><div style="height: 17px; background: repeating-linear-gradient(to bottom, #C9CDD3 0 1px, transparent 1px 4px)"></div></div>
          <div style="height: 46px; background: #FFFFFF; border-radius: 8px; border: 1px solid #D9DCE1; padding: 5px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #C2541F">Am</span><div style="height: 17px; background: repeating-linear-gradient(to bottom, #C9CDD3 0 1px, transparent 1px 4px)"></div></div>
          <div style="height: 46px; background: #FFFFFF; border-radius: 8px; border: 1px solid #D9DCE1; padding: 5px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #C2541F">F</span><div style="height: 17px; background: repeating-linear-gradient(to bottom, #C9CDD3 0 1px, transparent 1px 4px)"></div></div>
          <div style="height: 46px; background: #FFFFFF; border-radius: 8px; border: 1px solid #D9DCE1; padding: 5px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #C2541F">G</span><div style="height: 17px; background: repeating-linear-gradient(to bottom, #C9CDD3 0 1px, transparent 1px 4px)"></div></div>
          <div style="height: 46px; background: #FFFFFF; border-radius: 8px; border: 1px solid #D9DCE1; padding: 5px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; color: #C2541F">C/E</span><div style="height: 17px; background: repeating-linear-gradient(to bottom, #C9CDD3 0 1px, transparent 1px 4px)"></div></div>
